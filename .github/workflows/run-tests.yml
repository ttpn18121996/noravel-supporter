name: Run Tests

on:
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'releases/**'
  push:
    branches:
      - 'master'
      - 'main'
      - 'releases/**'

jobs:
  test_features:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x]

    runs-on: ${{ matrix.os }}

    steps:
    - name: "Checkout the code"
      uses: actions/checkout@v4

    - name: "Setup Node.js"
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: "Install npm dependencies"
      run: npm ci

    - name: "Build Native C++ Addon"
      run: npm run gyp:build

    - name: "Build TypeScript"
      run: npm run build

    - name: "Verify dist directory exists"
      run: ls -la dist/
    
    - name: "Run jest"
      run: npm run test
